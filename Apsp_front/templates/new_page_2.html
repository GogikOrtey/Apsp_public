{% extends "layout.html" %}

{% block title %}New Page 2{% endblock %}

{% block extra_css %}
<style>
    /* На этой странице: центрируем основной контейнер по вертикали */
    body {
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Широкая страница */
    .container {
        max-width: 1200px !important;
        height: 90vh;
        padding: 24px !important;
        margin: 0 !important;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Главный блок: 2 колонки */
    .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
        flex: 1;
        min-height: 0;
    }

    .page-title {
        margin: 0 0 14px 0;
        flex: 0 0 auto;
    }

    .col {
        display: grid;
        gap: 20px;
        min-height: 0;
        width: 550px;
    }

    .col--left {
        /* grid-template-rows: 3fr 1fr 2fr 3fr; */
        grid-template-rows: 210px 120px 160px 234px;
    }

    .col--right {
        grid-template-rows: 390px 80px 275px ;
    }

    /* Карточки */
    .panel {
        background: #ffffff;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 14px 14px 12px 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
    }

    .panel-title {
        color: #667eea;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 10px;
        line-height: 1.2;
    }

    /* Текущий шаг: только заголовок и он в 2 раза больше */
    .panel-title--big {
        font-size: 32px;
        text-align: center;
        margin-bottom: 0;
    }

    .panel-body {
        flex: 1;
        min-height: 0;
        background: #f7f7f7;
        border: 1px solid #e8e8e8;
        border-radius: 8px;
        padding: 12px;
        color: #222;
        white-space: pre-wrap;
        overflow: auto;
        font-size: 14px;
        line-height: 1.5;
    }

    /* Лог: textarea как в step6 (нормальные переносы + прокрутка) */
    .panel-body--log {
        width: 100%;
        height: 100%;
        resize: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .panel-body--image {
        display: flex;
    }

    /* .browser-screenshot {
        width: 120px;
        height: 100px;
        object-fit: contain;
        border-radius: 8px;
        background: #111;
        display: none; /* включим, когда загрузится */
    /* } */

    /* Высоты блоков */
    .panel--high { min-height: 0; }
    .panel--medium { min-height: 0; }
    .panel--small { min-height: 0; }

    /* Текущий шаг: маленький блок без поля */
    .panel--step {
        min-height: 0;
        justify-content: center;
    }

    /* Окно браузера: пока просто плейсхолдер */
    .image-placeholder {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-radius: 8px;
        border: 2px dashed #c9c9c9;
        background: linear-gradient(135deg, #f2f2f2 0%, #fafafa 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        text-align: center;
        padding: 16px;
        font-size: 14px;
    }

    /* Адаптив: на узких экранах — одна колонка */
    @media (max-width: 1100px) {
        .container { max-width: 900px !important; }
        .main-grid { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<!-- <h1 class="page-title">new_page_2</h1> -->

<div class="main-grid">
    <!-- Левая колонка -->
    <div class="col col--left">
        <div class="panel panel--high">
            <div class="panel-title">Размышление</div>
            <div class="panel-body" id="reflection_text"></div>
        </div>

        <div class="panel panel--small">
            <div class="panel-title">Цель</div>
            <div class="panel-body" id="goal_text"></div>
        </div>

        <div class="panel panel--medium">
            <div class="panel-title">Действие</div>
            <div class="panel-body" id="action_text"></div>
        </div>

        <div class="panel panel--high">
            <div class="panel-title">Update result</div>
            <div class="panel-body" id="update_result_text"></div>
        </div>
    </div>

    <!-- Правая колонка -->
    <div class="col col--right">
        <div class="panel panel--high">
            <div class="panel-title">Общий лог</div>
            <textarea class="panel-body panel-body--log" id="global_log_text" readonly spellcheck="false">Логи будут отображаться здесь</textarea>
        </div>

        <div class="panel panel--step">
            <div class="panel-title panel-title--big" id="current_step_title">Текущий шаг</div>
        </div>

        <div class="panel panel--medium">
            <div class="panel-title">Результат последней фазы</div>
            <div class="panel-body" id="last_phase_result_text"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const NEW_PAGE_2_FIELDS = [
        'reflection_text',
        'goal_text',
        'action_text',
        'update_result_text',
        'current_step_title',
        'last_phase_result_text',
    ];

    let lastStateJson = null;

    function applyNewPage2State(state) {
        if (!state) return;
        for (const id of NEW_PAGE_2_FIELDS) {
            const el = document.getElementById(id);
            if (!el) continue;
            const nextText = (state[id] == null) ? '' : String(state[id]);
            if (el.textContent !== nextText) {
                el.textContent = nextText;
            }
        }
    }

    async function pollNewPage2State() {
        try {
            const resp = await fetch('/api/new_page_2_state', { cache: 'no-store' });
            if (!resp.ok) return;
            const state = await resp.json();
            const asJson = JSON.stringify(state);
            if (asJson === lastStateJson) return;
            lastStateJson = asJson;
            applyNewPage2State(state);
        } catch (e) {
            // молча игнорируем: страница должна быть "тихой" даже при временных сбоях
        }
    }

    // Логика лога (как в step6): читаем /api/log и обновляем textarea, не ломая скролл пользователя
    async function updateGlobalLogContent() {
        const logTextarea = document.getElementById('global_log_text');
        if (!logTextarea) return;

        try {
            const response = await fetch('/api/log', { cache: 'no-store' });
            if (!response.ok) return;
            const text = await response.text();

            const currentScrollTop = logTextarea.scrollTop;
            const isScrolledToBottom = logTextarea.scrollHeight - logTextarea.clientHeight <= currentScrollTop + 1;

            if (logTextarea.value !== text) {
                logTextarea.value = text;
            }

            // Если пользователь был внизу, прокручиваем вниз после обновления
            if (isScrolledToBottom) {
                logTextarea.scrollTop = logTextarea.scrollHeight;
            } else {
                logTextarea.scrollTop = currentScrollTop;
            }
        } catch (e) {
            // тихо игнорируем
        }
    }

    // Когда main_funk_start_on_front() завершится в фоне — автоматически уходим на /new_page_3
    let redirectTriggered = false;
    async function pollFrontMainStatus() {
        if (redirectTriggered) return;
        try {
            const resp = await fetch('/api/front_main_status', { cache: 'no-store' });
            if (!resp.ok) return;
            const status = await resp.json();
            if (status && status.done) {
                redirectTriggered = true;
                window.location.href = '/new_page_3';
            }
        } catch (e) {
            // тихо игнорируем
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        pollNewPage2State();
        setInterval(pollNewPage2State, 250);

        updateGlobalLogContent();
        setInterval(updateGlobalLogContent, 500);

        pollFrontMainStatus();
        setInterval(pollFrontMainStatus, 500);

    //     // Скриншот браузера (Playwright): обновляем нечасто, чтобы не грузить CPU.
    //     const screenshotImg = document.getElementById('browser_screenshot');
    //     const screenshotPlaceholder = document.getElementById('browser_screenshot_placeholder');
    //     const SCREENSHOT_POLL_MS = 5000; // можно поменять на 10000

    //     function setScreenshotVisible(isVisible) {
    //         if (!screenshotImg || !screenshotPlaceholder) return;
    //         screenshotImg.style.display = isVisible ? 'block' : 'none';
    //         screenshotPlaceholder.style.display = isVisible ? 'none' : 'flex';
    //     }

    //     async function refreshBrowserScreenshot() {
    //         if (!screenshotImg) return;
    //         // cache-busting: каждый раз уникальный query, чтобы браузер не кешировал картинку
    //         screenshotImg.src = '/api/browser_screenshot?t=' + Date.now();
    //     }

    //     if (screenshotImg) {

    //             setScreenshotVisible(true);
    //         });

    //     // Первый запрос сразу + далее по таймеру
    //     refreshBrowserScreenshot();

</script>
{% endblock %}
