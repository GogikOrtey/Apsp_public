<!--
APSP Front UI style guide (быстрые заметки, чтобы не плодить разные стили по страницам)

Правило: при создании новых страниц/элементов сначала сверяйся с этим блоком и переиспользуй те же цвета/паттерны.

Цвета (из реальных страниц проекта):
- Акцентный "голубой/синий" для кнопок и акцентного текста: #667eea
  - Часто используемый hover для синего: #5568d3
- Негативный (ошибка/опасно) для кнопок и текста: #ff7518
- Зелёный (success/ok-элементы): #22c55e
- Второстепенный (не акцентный) текст: #555

Готовый tooltip (uid-tooltip) из main_page_1.html:
.uid-tooltip {
    display: inline;
    position: relative;
}
.uid-underline {
    border-bottom: 1px solid #bebebe;
    display: inline-block;
}
.uid-tooltip .uid-tooltip-text {
    visibility: hidden;
    width: 320px;
    background-color: #555;
    color: #fff;
    text-align: left;
    border-radius: 6px;
    padding: 10px;
    position: absolute;
    z-index: 10000;
    bottom: 125%;
    left: 50%;
    margin-left: -160px;
    opacity: 0;
    transition: opacity 0.3s;
    font-size: 13px;
    line-height: 1.4;
    font-weight: normal;
}
.uid-tooltip .uid-tooltip-text::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #555 transparent transparent transparent;
}
.uid-tooltip:hover .uid-tooltip-text {
    visibility: visible;
    opacity: 1;
}

Паттерны интерактива (hover/active):
- Hover на интерактивных элементах: filter: brightness(0.95);
- Active (нажатие): transform: scale(0.99);
-->


<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Многошаговая форма{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('content', filename='favicon_2.png') }}">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('content', filename='favicon_2.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('content', filename='favicon_2.png') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
            background-color: #e4e4e4;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        
        .step-indicator::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e0e0e0;
            z-index: 0;
        }
        
        .step {
            background: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0e0e0;
            position: relative;
            z-index: 1;
            font-weight: bold;
            color: #999;
        }
        
        .step.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .step.completed {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .checkbox-group,
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .checkbox-item,
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input[type="checkbox"],
        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #4caf50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
        }
        
        .summary-item {
            margin-bottom: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        
        .summary-item strong {
            color: #667eea;
        }
        
        .success-message {
            text-align: center;
            padding: 40px;
        }
        
        .success-message h2 {
            color: #4caf50;
            margin-bottom: 20px;
        }
        
        .success-icon {
            font-size: 64px;
            color: #4caf50;
            margin-bottom: 20px;
        }

        /* Tooltip (используется на страницах, например login_page.html) */
        .uid-tooltip {
            display: inline;
            position: relative;
        }

        .uid-underline {
            border-bottom: 1px solid #bebebe;
            display: inline-block;
        }

        .uid-tooltip .uid-tooltip-text {
            visibility: hidden;
            width: 320px;
            background-color: #555;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 10000;
            bottom: 125%;
            left: 50%;
            margin-left: -160px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 13px;
            line-height: 1.4;
            font-weight: normal;
        }

        .uid-tooltip .uid-tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #555 transparent transparent transparent;
        }

        .uid-tooltip:hover .uid-tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
