{% extends "layout.html" %}

{% block title %}New Page 1{% endblock %}

{% block extra_css %}
<style>
    /* Центрируем главный блок (container из layout.html) по вертикали только на этой странице */
    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Синий и чуть крупнее заголовок у поля, как в других экранах */
    .example1-label {
        color: #667eea;
        font-size: 18px;
        font-weight: 600;
    }

    /* Кнопка на всю ширину поля */
    .btn-full {
        width: 100%;
        display: block;
    }

    .form-group {
        /* height: 350px; */
        width: 400px;
    }

    /* Фиксируем ширину формы, чтобы кнопка была ровно как инпут */
    .example1-form {
        width: 400px;
    }

    /* Таймер (фиксированный блок справа снизу, поверх всего) */
    .corner-timer {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 99999;
        background: #ffffff;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 8px 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        color: #222;
        user-select: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1;
    }

    /* Таймер слева сверху */
    .corner-timer--left-top {
        left: 16px;
        top: 16px;
        right: auto;
        bottom: auto;
    }

    /* Таймер справа сверху */
    .corner-timer--right-top {
        right: 16px;
        top: 16px;
        left: auto;
        bottom: auto;
    }

    /* Статусы сервера */
    .status-online {
        /* background: #14eb31 !important; */
        background: #47d14c !important;
        /* border-color: #22c55e !important; */
        color: #ffffff !important;
        font-weight: 600;
    }

    .status-offline {
        background: #ff7518 !important;
        /* border-color: #ef4444 !important; */
        color: #ffffff !important;
        font-weight: 600;
    }

    .limit-error {
        color: rgb(243, 68, 24);
        /* font-weight: bold; */
        margin-top: 8px;
        display: none;
    }

    /* Блок статуса слева сверху */
    .status-block {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 99999;
        background: #ffffff;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        /* padding: 12px 16px; */
        padding: 16px 20px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        color: #222;
        user-select: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: fit-content;
    }

    .status-block__server {
        background: #ffffff;
        /* border: 2px solid #e0e0e0; */
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 14px;
        line-height: 1;
    }

    .status-block__tasks {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    .status-block__tasks-label {
        color: #555;
    }

    .status-block__tasks-value {
        font-weight: 600;
        color: #222;
    }

    .status-block__button {
        position: fixed;
        left: 16px;
        /* top: 130px; */
        top: 118px;
        z-index: 99999;
        padding: 8px 12px;
        /* padding: 8px 7px; */
        background: #667eea;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        transition: background 0.2s;
        display: block;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .status-block__button:hover {
        background: #5568d3;
    }
</style>
{% endblock %}

{% block content %}
<div class="status-block">
    <div class="status-block__server" id="server_status_indicator" title="Статус сервера">
        <span id="server_status_value">Status: ...</span>
    </div>
    <div class="status-block__tasks">
        <span class="status-block__tasks-label">Запущено задач: </span>
        <span class="status-block__tasks-value" id="active_tasks_value">...</span>
    </div>
</div>

<a href="{{ url_for('all_tasks') }}" class="status-block__button">Просмотреть все задачи</a>

<form method="POST" class="example1-form" id="new_page_1_form">
    <div class="form-group">
        <label for="site_url" class="example1-label">Введите адрес сайта</label>
        <input
            type="text"
            id="site_url"
            name="site_url"
            placeholder="http://systemarf.ru/"
            value="{{ site_url or '' }}"
            autocomplete="url"
            inputmode="url"
        >
        <div id="limit_error" class="limit-error" title="Нет, динамическая очередь задач ещё не реализована">
            Достигнут лимит одновременных задач. Пожалуйста, подождите завершения текущих.
        </div>
    </div>

    <button type="submit" class="btn btn-success btn-full" id="new_page_1_submit">Generate</button>
</form>

<script>
    (function () {
        const form = document.getElementById('new_page_1_form');
        const input = document.getElementById('site_url');
        const errorDiv = document.getElementById('limit_error');
        const counterValue = document.getElementById('active_tasks_value');
        const statusIndicator = document.getElementById('server_status_indicator');
        const statusValue = document.getElementById('server_status_value');
        const statusBlock = document.querySelector('.status-block');
        const statusButton = document.querySelector('.status-block__button');
        
        let currentActive = 0;
        let currentMax = 10;
        let isLoaded = false;
        let isServerOnline = false;

        if (!form || !input) return;

        // Синхронизация ширины кнопки с блоком
        function syncButtonWidth() {
            if (statusBlock && statusButton) {
                const blockWidth = statusBlock.offsetWidth;
                statusButton.style.width = blockWidth + 'px';
            }
        }

        // Вызываем синхронизацию после загрузки и при изменении размера
        syncButtonWidth();
        window.addEventListener('resize', syncButtonWidth);

        // Опрос статуса
        async function pollStatus() {
            try {
                const res = await fetch('/api/tasks/active_count');
                if (res.ok) {
                    const data = await res.json();
                    if (data.ok) {
                        currentActive = data.active;
                        currentMax = data.max;
                        isLoaded = true;
                        isServerOnline = true;
                        
                        if (counterValue) {
                            counterValue.textContent = `${currentActive}/${currentMax}`;
                        }
                        
                        // Обновляем статус сервера
                        if (statusIndicator && statusValue) {
                            statusValue.textContent = 'Status: Online';
                            statusIndicator.classList.remove('status-offline');
                            statusIndicator.classList.add('status-online');
                        }
                    }
                } else {
                    throw new Error('Server responded with error');
                }
            } catch (e) {
                console.error(e);
                isServerOnline = false;
                
                // Обновляем статус сервера на offline
                if (statusIndicator && statusValue) {
                    statusValue.textContent = 'Status: Offline';
                    statusIndicator.classList.remove('status-online');
                    statusIndicator.classList.add('status-offline');
                }
            }
        }

        // Запускаем опрос
        pollStatus();
        setInterval(pollStatus, 1000);

        // При вводе скрываем ошибку
        input.addEventListener('input', function() {
            if (errorDiv) errorDiv.style.display = 'none';
        });

        form.addEventListener('submit', function (e) {
            const v = (input.value || '').trim();
            
            // Проверка лимита
            if (isLoaded && currentActive >= currentMax) {
                e.preventDefault();
                if (errorDiv) {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = `Достигнут лимит задач (${currentActive}/${currentMax}). Пожалуйста, подождите завершения текущих.`;
                }
                return;
            }

            if (!v) {
                // По требованию: если пусто — по нажатию кнопки "ничего не происходит"
                e.preventDefault();
            }
        });
    })();
</script>
{% endblock %}
