{% extends "layout.html" %}

{% block title %}New Page 1{% endblock %}

{% block extra_css %}
<style>
    /* Центрируем главный блок (container из layout.html) по вертикали только на этой странице */
    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Синий и чуть крупнее заголовок у поля, как в других экранах */
    .example1-label {
        color: #667eea;
        font-size: 18px;
        font-weight: 600;
    }

    /* Кнопка на всю ширину поля */
    .btn-full {
        width: 100%;
        display: block;
    }

    .form-group {
        /* height: 350px; */
        width: 400px;
    }

    /* Фиксируем ширину формы, чтобы кнопка была ровно как инпут */
    .example1-form {
        width: 400px;
    }

    /* Таймер (фиксированный блок справа снизу, поверх всего) */
    .corner-timer {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 99999;
        background: #ffffff;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 8px 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        color: #222;
        user-select: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1;
    }

    /* Таймер слева сверху */
    .corner-timer--left-top {
        left: 16px;
        top: 16px;
        right: auto;
        bottom: auto;
    }

    .limit-error {
        color: rgb(243, 68, 24);
        /* font-weight: bold; */
        margin-top: 8px;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="corner-timer corner-timer--left-top" id="active_tasks_counter" title="Активные задачи / Максимум">
    <span id="active_tasks_value">...</span>
</div>

<form method="POST" class="example1-form" id="new_page_1_form">
    <div class="form-group">
        <label for="site_url" class="example1-label">Введите адрес сайта</label>
        <input
            type="text"
            id="site_url"
            name="site_url"
            placeholder="http://systemarf.ru/"
            value="{{ site_url or '' }}"
            autocomplete="url"
            inputmode="url"
        >
        <div id="limit_error" class="limit-error" title="Нет, динамическая очередь задач ещё не реализована">
            Достигнут лимит одновременных задач. Пожалуйста, подождите завершения текущих.
        </div>
    </div>

    <button type="submit" class="btn btn-success btn-full" id="new_page_1_submit">Generate</button>
</form>

<script>
    (function () {
        const form = document.getElementById('new_page_1_form');
        const input = document.getElementById('site_url');
        const errorDiv = document.getElementById('limit_error');
        const counterValue = document.getElementById('active_tasks_value');
        
        let currentActive = 0;
        let currentMax = 10;
        let isLoaded = false;

        if (!form || !input) return;

        // Опрос статуса
        async function pollStatus() {
            try {
                const res = await fetch('/api/tasks/active_count');
                if (res.ok) {
                    const data = await res.json();
                    if (data.ok) {
                        currentActive = data.active;
                        currentMax = data.max;
                        isLoaded = true;
                        if (counterValue) {
                            counterValue.textContent = `${currentActive}/${currentMax}`;
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Запускаем опрос
        pollStatus();
        setInterval(pollStatus, 1000);

        // При вводе скрываем ошибку
        input.addEventListener('input', function() {
            if (errorDiv) errorDiv.style.display = 'none';
        });

        form.addEventListener('submit', function (e) {
            const v = (input.value || '').trim();
            
            // Проверка лимита
            if (isLoaded && currentActive >= currentMax) {
                e.preventDefault();
                if (errorDiv) {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = `Достигнут лимит задач (${currentActive}/${currentMax}). Пожалуйста, подождите завершения текущих.`;
                }
                return;
            }

            if (!v) {
                // По требованию: если пусто — по нажатию кнопки "ничего не происходит"
                e.preventDefault();
            }
        });
    })();
</script>
{% endblock %}
