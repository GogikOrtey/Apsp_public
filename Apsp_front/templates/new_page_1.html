{% extends "layout.html" %}

{% block title %}New Page 1{% endblock %}

{% block extra_css %}
<style>
    /* Центрируем главный блок (container из layout.html) по вертикали только на этой странице */
    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Синий и чуть крупнее заголовок у поля, как в других экранах */
    .example1-label {
        color: #667eea;
        font-size: 18px;
        font-weight: 600;
    }

    /* Кнопка на всю ширину поля */
    .btn-full {
        width: 100%;
        display: block;
    }

    .form-group {
        /* height: 350px; */
        width: 400px;
    }

    /* Фиксируем ширину формы, чтобы кнопка была ровно как инпут */
    .example1-form {
        width: 400px;
    }
</style>
{% endblock %}

{% block content %}
<form method="POST" class="example1-form">
    <div class="form-group">
        <label for="site_url" class="example1-label">Введите адрес сайта</label>
        <input
            type="text"
            id="site_url"
            name="site_url"
            placeholder="https://makitaclub.ru"
            value="{{ site_url or '' }}"
            autocomplete="url"
            inputmode="url"
        >
    </div>

    <button type="submit" class="btn btn-success btn-full">Generate</button>
</form>
{% endblock %}
