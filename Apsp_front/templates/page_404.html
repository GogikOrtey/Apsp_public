{% extends "layout.html" %}

{% block title %}404 — Страница не найдена{% endblock %}

{% block content %}
<div class="success-message">
    <div class="success-icon">404</div>
    <h2>Упс! Такой страницы нет</h2>
    <p style="margin-top: 10px; color: #555;">
        Похоже, вы перешли по неверному адресу. Нажмите кнопку ниже, чтобы вернуться на главную страницу.
    </p>
    <div style="margin-top: 24px; display: flex; justify-content: center;">
        <a class="btn btn-success" href="{{ url_for('index') }}">Перейти на главную</a>
    </div>
</div>
{% endblock %}
