{% extends "layout.html" %}

{% block title %}Example 2{% endblock %}

{% block extra_css %}
<style>
    /* Центрируем главный блок (container из layout.html) по вертикали только на этой странице */
    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Синий и чуть крупнее заголовок у поля, как в других экранах */
    .example2-label {
        color: #667eea;
        font-size: 18px;
        font-weight: 600;
    }

    /* Кнопка на всю ширину формы */
    .btn-full {
        width: 100%;
        display: block;
    }

    /* Фиксируем ширину формы, чтобы кнопка была ровно как инпут */
    .example2-form {
        width: 400px;
    }
</style>
{% endblock %}

{% block content %}
<form method="POST" class="example2-form">
    <div class="form-group">
        <label for="site_url" class="example2-label">Введите адрес сайта</label>
        <input
            type="text"
            id="site_url"
            name="site_url"
            placeholder="https://som1.ru/"
            value="{{ site_url or '' }}"
            autocomplete="url"
            inputmode="url"
        >
    </div>

    <div class="form-group">
        <label for="regions" class="example2-label">Введите регионы</label>
        <input
            type="text"
            id="regions"
            name="regions"
            placeholder="Москва;Краснодар;Воронеж"
            value="{{ regions or '' }}"
            autocomplete="off"
        >
    </div>

    <button type="submit" class="btn btn-success btn-full">Generate</button>
</form>
{% endblock %}
