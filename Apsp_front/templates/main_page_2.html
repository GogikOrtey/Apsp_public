{% extends "layout.html" %}

{% block title %}New Page 2{% endblock %}

{% block extra_css %}
<style>
    /* На этой странице: центрируем основной контейнер по вертикали */
    body {
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Широкая страница */
    .container {
        max-width: 1200px !important;
        height: 90vh;
        padding: 24px !important;
        margin: 0 !important;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Главный блок: 2 колонки */
    .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
        flex: 1;
        min-height: 0;
    }

    /* Шапка страницы: заголовок (центр) + GIF поверх слоёв (НЕ влияет на layout) */
    .page-header {
        margin: -14px 0 10px 0;
        flex: 0 0 auto;
        text-align: center;
    }

    /* Обёртка под заголовок: центрируем текст и рисуем GIF абсолютно справа от текста */
    .page-title-wrap {
        display: inline-block;
        position: relative;
        /* Сдвиг влево на половину ширины GIF (40px / 2 = 20px) */
        transform: translateX(-20px);
    }

    .page-title {
        margin: 0;
        display: inline-block;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: #222;
        line-height: 1.2;
    }

    /* GIF-лоадер: абсолютно справа от текста, не занимает место в потоке */
    .page-title-loader {
        position: absolute;
        left: calc(100% + 8px);
        top: 50%;
        transform: translateY(-50%);
        width: 30px;
        height: 30px;
        max-width: 30px;
        max-height: 30px;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
    }

    .col {
        display: grid;
        gap: 20px;
        min-height: 0;
        width: 550px;
    }

    .col--left {
        /* grid-template-rows: 3fr 1fr 2fr 3fr; */
        /* grid-template-rows: 210px 120px 160px 234px; */
        grid-template-rows: 210px 120px 160px 220px;
    }

    .col--right {
        /* grid-template-rows: 390px 80px 275px ; */
        grid-template-rows: 376px 80px 275px ;
    }

    /* Карточки */
    .panel {
        background: #ffffff;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 14px 14px 12px 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
    }

    .panel-title {
        color: #667eea;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 10px;
        line-height: 1.2;
    }

    /* Вкладки внутри панели (правый нижний блок) */
    .panel-tabs {
        display: flex;
        gap: 8px;
        /* margin-bottom: 10px; */
        margin-bottom: 0px;
        flex: 0 0 auto;
    }

    .panel-tab {
        appearance: none;
        border: 1px solid #e0e0e0;
        background: #f7f7f7;
        color: #444;
        /* border-radius: 8px; */
        border-radius: 8px 8px 0px 0px;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        user-select: none;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
        white-space: nowrap;
    }

    .panel-tab.is-active {
        background: #ffffff;
        /* border-color: #667eea; */
        color: #667eea;
    }

    .panel-tab:hover {
        outline: none;
        /* box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.18); */
        background: #e0e2e9;
    }

    /* Важно: hidden должен всегда скрывать панель, даже если у неё задан display в CSS */
    [hidden] { display: none !important; }

    .panel-tab-content {
        flex: 1;
        min-height: 0;
    }

    .browser-window-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        flex: 1 1 auto;
        display: block;
    }

    /* Текущий шаг: только заголовок и он в 2 раза больше */
    .panel-title--big {
        font-size: 18px;
        text-align: center;
        margin-bottom: 0;
    }

    .panel-body {
        flex: 1;
        min-height: 0;
        background: #f7f7f7;
        border: 1px solid #e8e8e8;
        border-radius: 8px;
        padding: 12px;
        color: #222;
        white-space: pre-wrap;
        overflow: auto;
        font-size: 14px;
        line-height: 1.5;
    }

    /* Лог: textarea как в step6 (нормальные переносы + прокрутка) */
    .panel-body--log {
        width: 100%;
        height: 100%;
        resize: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .panel-body--image {
        display: flex;
        overflow: hidden;
    }

    /* .browser-screenshot {
        width: 120px;
        height: 100px;
        object-fit: contain;
        border-radius: 8px;
        background: #111;
        display: none; /* включим, когда загрузится */
    /* } */

    /* Высоты блоков */
    .panel--high { min-height: 0; }
    .panel--medium { min-height: 0; }
    .panel--small { min-height: 0; }

    /* Текущий шаг: маленький блок без поля */
    .panel--step {
        min-height: 0;
        justify-content: center;
    }

    /* Окно браузера: пока просто плейсхолдер */
    .image-placeholder {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-radius: 8px;
        border: 2px dashed #c9c9c9;
        background: linear-gradient(135deg, #f2f2f2 0%, #fafafa 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        text-align: center;
        padding: 16px;
        font-size: 14px;
    }

    /* Таймер (фиксированный блок справа снизу, поверх всего) */
    .corner-timer {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 99999;
        background: #ffffff;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 8px 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        color: #222;
        user-select: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1;
    }

    /* Когда таймер внутри контейнера, сбрасываем его фиксированное позиционирование */
    .corner-controls-right .corner-timer {
        position: static;
    }

    /* Таймер слева снизу (время с момента открытия main_page_2) */
    .corner-timer--left {
        left: 16px;
        right: auto;
    }

    /* Контейнер для кнопки и таймера справа снизу */
    .corner-controls-right {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 100000;
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .corner-stop-btn {
        padding: 6px 14px;
        /* border: 2px solid #e53935; */
        /* border: 2px solid #ec5b58; */
        /* border: 2px solid #f39b99; */
        border: 2px solid #ffc9c8;
        border-radius: 10px;
        background: #fff;
        /* color: #e53935; */
        /* color: #0f0f0f; */
        /* color: #7e7e7e; */
        color: #aaaaaa;
        font-weight: 700;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: all 0.2s ease;
        line-height: 1;
        font-size: 14px;
    }

    .corner-stop-btn:hover {
        background: #e53935;
        color: #fff;
    }

    .corner-stop-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        border-color: #999;
        color: #999;
    }

    /* Адаптив: на узких экранах — одна колонка */
    @media (max-width: 1100px) {
        .container { max-width: 900px !important; }
        .main-grid { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title-wrap">
        <h1 class="page-title">{{ page_heading or "Генерируем парсер" }}</h1>
        <img class="page-title-loader" src="{{ url_for('content', filename='loading_gif_1.gif') }}" alt="" aria-hidden="true" />
    </div>
</div>

<div class="main-grid">
    <!-- Левая колонка -->
    <div class="col col--left">
        <div class="panel panel--high">
            <div class="panel-title">Размышление</div>
            <div class="panel-body" id="reflection_text"></div>
        </div>

        <div class="panel panel--small">
            <div class="panel-title">Цель</div>
            <div class="panel-body" id="goal_text"></div>
        </div>

        <div class="panel panel--medium">
            <div class="panel-title">Действие</div>
            <div class="panel-body" id="action_text"></div>
        </div>

        <div class="panel panel--high">
            <div class="panel-title">Update result</div>
            <div class="panel-body" id="update_result_text"></div>
        </div>
    </div>

    <!-- Правая колонка -->
    <div class="col col--right">
        <div class="panel panel--high">
            <div class="panel-tabs" role="tablist" aria-label="Переключение логов">
                <button type="button" class="panel-tab is-active" id="tab_btn_global_log" role="tab" aria-selected="true" aria-controls="global_log_text">
                    Общий лог
                </button>
                <button type="button" class="panel-tab" id="tab_btn_useful_log" role="tab" aria-selected="false" aria-controls="useful_log_text">
                    Полезный лог
                </button>
            </div>

            <textarea class="panel-body panel-body--log panel-tab-content" id="global_log_text" role="tabpanel" aria-labelledby="tab_btn_global_log" readonly spellcheck="false">Логи будут отображаться здесь</textarea>
            <textarea class="panel-body panel-body--log panel-tab-content" id="useful_log_text" role="tabpanel" aria-labelledby="tab_btn_useful_log" readonly spellcheck="false" hidden>Полезный лог будет отображаться здесь</textarea>
        </div>

        <div class="panel panel--step">
            <div class="panel-title panel-title--big" id="current_step_title">Текущий шаг</div>
        </div>

        <div class="panel panel--medium">
            <div class="panel-tabs" role="tablist" aria-label="Переключение контента">
                <button type="button" class="panel-tab is-active" id="tab_btn_browser_window" role="tab" aria-selected="true" aria-controls="tab_content_browser_window">
                    Текущее окно браузера
                </button>
                <button type="button" class="panel-tab" id="tab_btn_last_phase_result" role="tab" aria-selected="false" aria-controls="tab_content_last_phase_result">
                    Результат последней фазы
                </button>
            </div>

            <div class="panel-body panel-body--image panel-tab-content" id="tab_content_browser_window" role="tabpanel" aria-labelledby="tab_btn_browser_window">
                <img
                    id="browser_window_image"
                    class="browser-window-img"
                    alt=""
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                />
            </div>

            <div class="panel-body panel-tab-content" id="tab_content_last_phase_result" role="tabpanel" aria-labelledby="tab_btn_last_phase_result" hidden>
                <div id="last_phase_result_text"></div>
            </div>
        </div>
    </div>
</div>

<!-- Кнопки и таймер справа снизу -->
<div class="corner-controls-right">
    <button type="button" class="corner-stop-btn" id="stop_generation_btn" aria-label="Остановить генерацию">
        Stop generation
    </button>

    <div class="corner-timer" id="corner_timer" title="Количество секунд с последнего ответа ChatGPT">
        <span id="corner_timer_value">0.0</span>
    </div>
</div>

<!-- Общий таймер (с момента открытия main_page_2 до окончания генерации) -->
<div class="corner-timer corner-timer--left" id="corner_total_timer" title="Общее время с начала генерации">
    <span id="corner_total_timer_value">0 сек.</span>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const TASK_UID = (location.pathname.split('/').filter(Boolean).pop()) || '';
    const __APSP_IS_REMOTE_HOST = !(['127.0.0.1', 'localhost'].includes((location.hostname || '').toLowerCase()));

    // На внешних доменах (ngrok) слишком частый polling может "убить" туннель.
    // Поэтому делаем интервалы более щадящими.
    const __APSP_POLL_NEW_PAGE_2_STATE_MS = __APSP_IS_REMOTE_HOST ? 1000 : 250;
    const __APSP_POLL_TASK_STATUS_MS = __APSP_IS_REMOTE_HOST ? 2000 : 500;
    const __APSP_SCREENSHOT_REFRESH_MS = __APSP_IS_REMOTE_HOST ? 10000 : 5000;
    const NEW_PAGE_2_FIELDS = [
        'reflection_text',
        'goal_text',
        'action_text',
        'update_result_text',
        'current_step_title',
        'last_phase_result_text',
    ];

    let lastStateJson = null;
    let lastTimerResetSeq = null;
    const GLOBAL_LOG_TAIL_BYTES = __APSP_IS_REMOTE_HOST ? 200_000 : 500_000; // ~0.2MB/0.5MB хвоста лога вместо чтения всего файла
    const GLOBAL_LOG_POLL_MS = __APSP_IS_REMOTE_HOST ? 2000 : 1000;
    let globalLogRequestInFlight = false;
    const USEFUL_LOG_TAIL_BYTES = __APSP_IS_REMOTE_HOST ? 200_000 : 500_000;
    const USEFUL_LOG_POLL_MS = __APSP_IS_REMOTE_HOST ? 2000 : 1000;
    let usefulLogRequestInFlight = false;
    let stopRequestInFlight = false;

    // --- Таймер (0.1s) ---
    let timerStartMs = 0;
    let timerRafId = null;
    let timerLastPaintTenth = null;

    function _nowMs() {
        return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    }

    function resetCornerTimer() {
        timerStartMs = _nowMs();
        timerLastPaintTenth = null;
        paintCornerTimer(); // сразу обновим UI
    }

    function paintCornerTimer() {
        const el = document.getElementById('corner_timer_value');
        if (!el) return;
        const elapsedS = Math.max(0, (_nowMs() - timerStartMs) / 1000);
        const tenth = Math.floor(elapsedS * 10 + 1e-6); // защита от дрожания float
        if (timerLastPaintTenth === tenth) return;
        timerLastPaintTenth = tenth;
        el.textContent = (tenth / 10).toFixed(1);
    }

    function startCornerTimerLoop() {
        if (timerRafId != null) return;
        const loop = () => {
            paintCornerTimer();
            timerRafId = window.requestAnimationFrame(loop);
        };
        timerRafId = window.requestAnimationFrame(loop);
    }

    function stopCornerTimerLoop() {
        if (timerRafId == null) return;
        try { window.cancelAnimationFrame(timerRafId); } catch (e) {}
        timerRafId = null;
    }

    // --- Общий таймер (с начала main_page_2, без десятых) ---
    let totalTimerStartMs = 0;
    let totalTimerRafId = null;
    let totalTimerLastWholeSecond = null;

    function _formatTotalSeconds(seconds) {
        const s = Math.max(0, Math.floor(Number(seconds) || 0));
        if (s < 60) return `${s} сек.`;
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${m} мин. ${r} сек.`;
    }

    function initTotalTimerStart() {
        if (totalTimerStartMs > 0) return; // не сбрасываем
        totalTimerStartMs = _nowMs();
        totalTimerLastWholeSecond = null;
        paintTotalTimer();
    }

    function paintTotalTimer() {
        const el = document.getElementById('corner_total_timer_value');
        if (!el) return;
        if (!totalTimerStartMs) return;
        const elapsedS = Math.max(0, (_nowMs() - totalTimerStartMs) / 1000);
        const whole = Math.floor(elapsedS + 1e-6);
        if (totalTimerLastWholeSecond === whole) return;
        totalTimerLastWholeSecond = whole;
        el.textContent = _formatTotalSeconds(whole);
    }

    function startTotalTimerLoop() {
        if (totalTimerRafId != null) return;
        const loop = () => {
            paintTotalTimer();
            totalTimerRafId = window.requestAnimationFrame(loop);
        };
        totalTimerRafId = window.requestAnimationFrame(loop);
    }

    function stopTotalTimerLoop() {
        if (totalTimerRafId == null) return;
        try { window.cancelAnimationFrame(totalTimerRafId); } catch (e) {}
        totalTimerRafId = null;
    }

    // --- Вкладки: "Текущее окно браузера" / "Результат последней фазы" ---
    let __setNewPage2RightTab = null;

    // --- Вкладки: "Общий лог" / "Полезный лог" ---
    let __setNewPage2LogTab = null;

    // --- Скриншот окна Playwright (каждые 5 секунд) ---
    let __browserWindowScreenshotTimer = null;
    function startBrowserWindowScreenshotLoop() {
        const img = document.getElementById('browser_window_image');
        if (!img) return;

        // Привязываем обработчики один раз
        if (!img.dataset || img.dataset.apspScreenshotBound !== '1') {
            try {
                img.addEventListener('load', function() {
                    img.style.opacity = '1';
                    img.removeAttribute('title');
                });
                img.addEventListener('error', function() {
                    img.style.opacity = '0.25';
                    img.title = 'Скриншот окна браузера пока недоступен (Playwright ещё не запущен?)';
                });
                if (img.dataset) img.dataset.apspScreenshotBound = '1';
            } catch (e) {}
        }

        function refresh() {
            if (!TASK_UID) return;
            // cache-busting: каждый раз уникальный query, чтобы браузер не кешировал картинку
            img.src = `/api/task/${TASK_UID}/browser_screenshot?t=${Date.now()}`;
        }

        refresh();
        if (__browserWindowScreenshotTimer != null) return;
        __browserWindowScreenshotTimer = setInterval(refresh, __APSP_SCREENSHOT_REFRESH_MS);
    }

    function stopBrowserWindowScreenshotLoop() {
        if (__browserWindowScreenshotTimer == null) return;
        try { clearInterval(__browserWindowScreenshotTimer); } catch (e) {}
        __browserWindowScreenshotTimer = null;
    }
    function initNewPage2RightTabs() {
        const btnBrowser = document.getElementById('tab_btn_browser_window');
        const btnLastPhase = document.getElementById('tab_btn_last_phase_result');
        const panelBrowser = document.getElementById('tab_content_browser_window');
        const panelLastPhase = document.getElementById('tab_content_last_phase_result');
        if (!btnBrowser || !btnLastPhase || !panelBrowser || !panelLastPhase) return;

        function setActive(tabKey) {
            const isBrowser = tabKey === 'browser';

            btnBrowser.classList.toggle('is-active', isBrowser);
            btnLastPhase.classList.toggle('is-active', !isBrowser);

            btnBrowser.setAttribute('aria-selected', isBrowser ? 'true' : 'false');
            btnLastPhase.setAttribute('aria-selected', (!isBrowser) ? 'true' : 'false');

            panelBrowser.hidden = !isBrowser;
            panelLastPhase.hidden = isBrowser;
        }

        btnBrowser.addEventListener('click', () => setActive('browser'));
        btnLastPhase.addEventListener('click', () => setActive('last_phase'));

        // По умолчанию активна вкладка "Текущее окно браузера"
        setActive('browser');
        __setNewPage2RightTab = setActive;
    }

    function initNewPage2LogTabs() {
        const btnGlobal = document.getElementById('tab_btn_global_log');
        const btnUseful = document.getElementById('tab_btn_useful_log');
        const panelGlobal = document.getElementById('global_log_text');
        const panelUseful = document.getElementById('useful_log_text');
        if (!btnGlobal || !btnUseful || !panelGlobal || !panelUseful) return;

        function scrollTextareaToBottom(textareaEl) {
            if (!textareaEl) return;
            try {
                textareaEl.scrollTop = textareaEl.scrollHeight;
            } catch (e) {}
        }

        function setActive(tabKey) {
            const isGlobal = tabKey === 'global';

            btnGlobal.classList.toggle('is-active', isGlobal);
            btnUseful.classList.toggle('is-active', !isGlobal);

            btnGlobal.setAttribute('aria-selected', isGlobal ? 'true' : 'false');
            btnUseful.setAttribute('aria-selected', (!isGlobal) ? 'true' : 'false');

            panelGlobal.hidden = !isGlobal;
            panelUseful.hidden = isGlobal;

            if (isGlobal) {
                // Важно: дёргаем прокрутку после показа textarea (и ещё раз "после кадра")
                scrollTextareaToBottom(panelGlobal);
                try { window.requestAnimationFrame(() => scrollTextareaToBottom(panelGlobal)); } catch (e) {}
                try { setTimeout(() => scrollTextareaToBottom(panelGlobal), 0); } catch (e) {}
            }
        }

        btnGlobal.addEventListener('click', () => setActive('global'));
        btnUseful.addEventListener('click', () => setActive('useful'));

        setActive('global');
        __setNewPage2LogTab = setActive;
    }

    function resetNewPage2Ui() {
        // Очищаем "карточки" (могут быть восстановлены браузером при Back/Forward)
        for (const id of NEW_PAGE_2_FIELDS) {
            const el = document.getElementById(id);
            if (!el) continue;
            el.textContent = '';
        }
        // Возвращаем дефолтный заголовок текущего шага
        const stepTitle = document.getElementById('current_step_title');
        if (stepTitle) stepTitle.textContent = 'Текущий шаг';

        // Очищаем лог (textarea)
        const logTextarea = document.getElementById('global_log_text');
        if (logTextarea) {
            logTextarea.value = '';
            logTextarea.scrollTop = 0;
        }
        const usefulLogTextarea = document.getElementById('useful_log_text');
        if (usefulLogTextarea) {
            usefulLogTextarea.value = '';
            usefulLogTextarea.scrollTop = 0;
        }

        // Форсируем первое применение state после очистки
        lastStateJson = null;
        lastTimerResetSeq = null;
    }

    function applyNewPage2State(state) {
        if (!state) return;
        for (const id of NEW_PAGE_2_FIELDS) {
            const el = document.getElementById(id);
            if (!el) continue;
            const nextText = (state[id] == null) ? '' : String(state[id]);
            if (el.textContent !== nextText) {
                el.textContent = nextText;
            }
        }
    }

    async function pollNewPage2State() {
        if (!TASK_UID) return;
        try {
            const resp = await fetch(`/api/task/${TASK_UID}/new_page_2_state`, { cache: 'no-store' });
            if (!resp.ok) return;
            const state = await resp.json();

            // Сбрасываем таймер, если сервер сообщил о событии (инкремент timer_reset_seq)
            const nextSeq = (state && state.timer_reset_seq != null) ? String(state.timer_reset_seq) : null;
            if (nextSeq && nextSeq !== lastTimerResetSeq) {
                lastTimerResetSeq = nextSeq;
                resetCornerTimer();
            }

            const asJson = JSON.stringify(state);
            if (asJson === lastStateJson) return;
            lastStateJson = asJson;
            applyNewPage2State(state);
        } catch (e) {
            // молча игнорируем: страница должна быть "тихой" даже при временных сбоях
        }
    }

    // Логика лога (как в step6): читаем /api/log и обновляем textarea, не ломая скролл пользователя
    async function updateGlobalLogContent() {
        const logTextarea = document.getElementById('global_log_text');
        if (!logTextarea) return;
        if (globalLogRequestInFlight) return;

        try {
            globalLogRequestInFlight = true;
            if (!TASK_UID) return;
            const response = await fetch(`/api/task/${TASK_UID}/logs/output?tail_bytes=${GLOBAL_LOG_TAIL_BYTES}`, { cache: 'no-store' });
            if (!response.ok) return;
            const text = await response.text();

            const currentScrollTop = logTextarea.scrollTop;
            const isScrolledToBottom = logTextarea.scrollHeight - logTextarea.clientHeight <= currentScrollTop + 1;

            if (logTextarea.value !== text) {
                logTextarea.value = text;
            }

            // Если пользователь был внизу, прокручиваем вниз после обновления
            if (isScrolledToBottom) {
                logTextarea.scrollTop = logTextarea.scrollHeight;
            } else {
                logTextarea.scrollTop = currentScrollTop;
            }
        } catch (e) {
            // тихо игнорируем
        } finally {
            globalLogRequestInFlight = false;
        }
    }

    async function updateUsefulLogContent() {
        const logTextarea = document.getElementById('useful_log_text');
        if (!logTextarea) return;
        if (usefulLogRequestInFlight) return;

        try {
            usefulLogRequestInFlight = true;
            if (!TASK_UID) return;
            const response = await fetch(`/api/task/${TASK_UID}/logs/useful?tail_bytes=${USEFUL_LOG_TAIL_BYTES}`, { cache: 'no-store' });
            if (!response.ok) return;
            const text = await response.text();

            const currentScrollTop = logTextarea.scrollTop;
            const isScrolledToBottom = logTextarea.scrollHeight - logTextarea.clientHeight <= currentScrollTop + 1;

            if (logTextarea.value !== text) {
                logTextarea.value = text;
            }

            if (isScrolledToBottom) {
                logTextarea.scrollTop = logTextarea.scrollHeight;
            } else {
                logTextarea.scrollTop = currentScrollTop;
            }
        } catch (e) {
            // тихо игнорируем
        } finally {
            usefulLogRequestInFlight = false;
        }
    }

    // Когда задача завершится — автоматически уходим на /main_page_3/<uid>
    let redirectTriggered = false;
    async function pollTaskStatus() {
        if (redirectTriggered) return;
        if (!TASK_UID) return;
        try {
            const resp = await fetch(`/api/task/${TASK_UID}/status`, { cache: 'no-store' });
            if (!resp.ok) return;
            const status = await resp.json();
            if (status && (status.status === 'done' || status.status === 'error')) {
                redirectTriggered = true;
                window.location.href = `/main_page_3/${TASK_UID}/`;
            }
        } catch (e) {
            // тихо игнорируем
        }
    }

    async function stopGeneration() {
        if (!TASK_UID) return;
        if (stopRequestInFlight) return;
        const btn = document.getElementById('stop_generation_btn');
        stopRequestInFlight = true;
        if (btn) {
            btn.disabled = true;
            btn.textContent = 'Stopping...';
        }
        try {
            const resp = await fetch(`/api/task/${TASK_UID}/stop`, { method: 'POST' });
            if (!resp.ok) {
                throw new Error('stop_failed');
            }
            if (btn) {
                btn.textContent = 'Stopped';
            }
        } catch (e) {
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Stop generation';
            }
        } finally {
            stopRequestInFlight = false;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        resetNewPage2Ui();
        initNewPage2RightTabs();
        initNewPage2LogTabs();
        resetCornerTimer();
        startCornerTimerLoop();
        initTotalTimerStart();
        startTotalTimerLoop();
        pollNewPage2State();
        setInterval(pollNewPage2State, __APSP_POLL_NEW_PAGE_2_STATE_MS);

        updateGlobalLogContent();
        setInterval(updateGlobalLogContent, GLOBAL_LOG_POLL_MS);

        updateUsefulLogContent();
        setInterval(updateUsefulLogContent, USEFUL_LOG_POLL_MS);

        pollTaskStatus();
        setInterval(pollTaskStatus, __APSP_POLL_TASK_STATUS_MS);

        startBrowserWindowScreenshotLoop();

        const stopBtn = document.getElementById('stop_generation_btn');
        if (stopBtn) {
            stopBtn.addEventListener('click', stopGeneration);
        }
    });

    // Если браузер восстанавливает страницу из bfcache (Back/Forward), DOMContentLoaded не сработает.
    window.addEventListener('pageshow', function (event) {
        if (event && event.persisted) {
            resetNewPage2Ui();
            if (typeof __setNewPage2RightTab === 'function') __setNewPage2RightTab('browser');
            if (typeof __setNewPage2LogTab === 'function') __setNewPage2LogTab('global');
            resetCornerTimer();
            startCornerTimerLoop();
            initTotalTimerStart();
            startTotalTimerLoop();
            startBrowserWindowScreenshotLoop();
        }
    });

    // На всякий случай: при уходе со страницы прекращаем loop
    window.addEventListener('pagehide', function () {
        stopCornerTimerLoop();
        stopTotalTimerLoop();
        stopBrowserWindowScreenshotLoop();
    });
</script>
{% endblock %}
