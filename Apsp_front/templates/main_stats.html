{% extends "layout.html" %}
{% block title %}Статистика{% endblock %}
{% block content %}

<h1 style="margin-bottom: 14px;">Статистика сервера</h1>
<div style="color:#555; text-align:center; margin-bottom: 18px;">
    Обновление каждые 2 секунды
</div>

<div id="err" style="color:#b00; margin: 8px 0; text-align:center;"></div>

<div style="display: flex; flex-direction: column; gap: 12px; max-width: 700px; margin: 0 auto;">
    <div style="padding:12px; border:1px solid #ddd; border-radius:8px; background:#fff;">
        <h3 style="margin-bottom:8px;">Uptime</h3>
        <div id="uptime">—</div>
    </div>

    <div style="padding:12px; border:1px solid #ddd; border-radius:8px; background:#fff;">
        <h3 style="margin-bottom:8px;">Задачи</h3>
        <div id="tasks">—</div>
    </div>

    <div style="padding:12px; border:1px solid #ddd; border-radius:8px; background:#fff;">
        <h3 style="margin-bottom:8px;">CPU</h3>
        <div id="cpu">—</div>
    </div>

    <div style="padding:12px; border:1px solid #ddd; border-radius:8px; background:#fff;">
        <h3 style="margin-bottom:8px;">RAM</h3>
        <div id="mem">—</div>
    </div>

    <div style="padding:12px; border:1px solid #ddd; border-radius:8px; background:#fff;">
        <h3 style="margin-bottom:8px;">Disk (там, где RESULT_TASKS)</h3>
        <div id="disk">—</div>
    </div>
</div>

<script>
    function fmtBytes(n) {
        if (n == null) return '—';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let x = Number(n);
        let i = 0;
        while (x >= 1024 && i < units.length - 1) { x /= 1024; i++; }
        return x.toFixed(2) + ' ' + units[i];
    }

    function fmtUptime(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return `${h} ч ${m} мин ${s} сек`;
    }

    async function tick() {
        const errEl = document.getElementById('err');
        errEl.textContent = '';

        let r, data;
        try {
            r = await fetch('/api/system/stats', { cache: 'no-store' });
            data = await r.json();
        } catch (e) {
            errEl.textContent = 'Не удалось получить /api/system/stats';
            return;
        }

        if (!data || !data.ok) {
            errEl.textContent = 'Ошибка: ' + ((data && data.error) ? data.error : 'unknown');
            return;
        }

        document.getElementById('uptime').textContent = fmtUptime(data.uptime_seconds);

        const t = data.tasks || {};
        document.getElementById('tasks').innerHTML =
            `Активно задач: <b>${t.active_runtime ?? '—'}</b><br>` +
            `Max workers:   <b>${t.max_workers ?? '—'}</b><br><br>` +
            `В работе: <b>${t.work ?? '—'}</b><br>` +
            `На паузе: <b>${t.paused ?? '—'}</b><br>` +
            `Завершены: <b>${t.completed ?? '—'}</b><br>` + 
            `Failed: <b>${t.failed ?? '—'}</b><br>` + 
            `Всего: <b>${t.total ?? '—'}</b>`;

        const cpu = data.cpu;
        document.getElementById('cpu').textContent =
            cpu ? (Number(cpu.percent).toFixed(1) + '%') : (data.psutil_available ? '—' : 'psutil не установлен');

        const mem = data.memory;
        document.getElementById('mem').innerHTML =
            mem ? `${Number(mem.percent).toFixed(1)}% (used ${fmtBytes(mem.used)} / total ${fmtBytes(mem.total)})`
                : (data.psutil_available ? '—' : 'psutil не установлен');

        const disk = data.disk;
        document.getElementById('disk').innerHTML =
            disk ? `${Number(disk.percent).toFixed(1)}% (used ${fmtBytes(disk.used)} / total ${fmtBytes(disk.total)})`
                : (data.psutil_available ? '—' : 'psutil не установлен');
    }

    tick();
    setInterval(tick, 2000);
</script>

<a href="{{ url_for('main_page_1') }}" class="back-button">Назад</a>
{% endblock %}

{% block extra_css %}
<style>
    /* Фиксированная кнопка "Назад" в левом верхнем углу */
    .back-button {
        position: fixed;
        top: 20px;
        left: 20px;
        background: white;
        color: black;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 500;
        font-size: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        z-index: 1000;
        transition: all 0.2s ease;
    }

    .back-button:hover {
        filter: brightness(0.95);
    }

    .back-button:active {
        transform: scale(0.95);
    }

    h3 {
        color: #222;
    }
</style>
{% endblock %}
